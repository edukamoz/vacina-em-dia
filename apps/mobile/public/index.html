<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <!-- App instalável (PWA): manifesto e ícone do iOS. O tema e a descrição vêm do app.json. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vacina em Dia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /*
       * Tela cheia sem folga: o corpo não tem margem, não rola e não "estica" (overscroll), e a raiz
       * fica presa à janela visível (100dvh acompanha a barra de endereço do celular, que sobe e
       * desce). Sem isto, a página rolava alguns pixels, o botão fixo "Criar conta" andava e o pé da
       * tela aparecia em branco. O fundo vem do tema (--cor-fundo) para nunca aparecer branco.
       */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: var(--cor-fundo, #ffffff);
      }
      #root {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        flex: 1;
      }
      @supports (height: 100dvh) {
        #root {
          height: 100dvh;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>Você precisa ativar o JavaScript para usar o Vacina em Dia.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
