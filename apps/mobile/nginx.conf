server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # A API fica atrás do mesmo endereço do app (sem CORS). `api` é o nome do serviço no compose.
  location /api/ {
    proxy_pass http://api:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos com hash no nome podem ser guardados por muito tempo.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Aplicativo de página única: qualquer rota volta para o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
