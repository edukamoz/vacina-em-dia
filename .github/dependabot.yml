# Atualizações automáticas de dependências (aviso de vulnerabilidade e PR com a correção).
# Os PRs seguem o commitlint do projeto (chore/ci), rodam o CI completo e nunca entram sozinhos:
# o autor revisa e mescla. Poucos PRs abertos por vez e agrupados, para não inundar a fila.
#
# Versões MAIORES de plataforma não vêm por aqui (decisão de 17/11/2026): o Expo SDK 57 para o 58,
# o React Native, o TypeScript 7, o `@types/node` (o projeto fixa o Node 24 em `.nvmrc`) e o Node da
# imagem Docker quebram o app e o CI juntos (PRs 300, 307, 308 e 309). Cada uma é uma tarefa própria,
# com migração e teste em aparelho, feita por pedido e não por robô. Os grupos só aceitam
# atualizações menores e de correção.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    ignore:
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      expo:
        patterns: ['expo*', '@expo/*', 'react-native*', '@react-native/*', 'react', 'react-dom']
        update-types: ['minor', 'patch']
      testes:
        patterns: ['jest*', '@types/*', '@testing-library/*', 'playwright*', '@playwright/*']
        update-types: ['minor', 'patch']
      lint-e-formato:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'typescript']
        update-types: ['minor', 'patch']
  - package-ecosystem: pip
    directory: /apps/nlp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci'
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore'
