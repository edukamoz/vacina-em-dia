name: Deploy

# Publica a API (Azure Functions) e o app web (Static Web Apps) na Azure (SCRUM-22).
# Roda ao integrar na main ou manualmente. Os segredos ficam em Settings > Secrets do GitHub,
# nunca no repositório. A API entra na Azure por login federado (OIDC, sem senha guardada):
# AZURE_CLIENT_ID, AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID (identificadores, não são segredos de
# acesso por si sós). O app web usa AZURE_STATIC_WEB_APPS_API_TOKEN.
on:
  push:
    branches: [main]
    # Documentos Word e arte não mudam o que vai para a Azure.
    paths-ignore:
      - 'doctos/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FUNCTIONAPP_NAME: func-vacinaemdia-vedia6398
  API_URL: https://func-vacinaemdia-vedia6398.azurewebsites.net/api
  NLP_FUNCTIONAPP_NAME: func-nlp-vacinaemdia-vedia6398

jobs:
  api:
    name: Publicar a API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Compilar o domínio compartilhado e a API
        run: |
          npm ci --ignore-scripts
          npm run build -w @vacina/shared -w @vacina/api

      - name: Montar o pacote de produção
        run: |
          rm -rf node_modules
          npm ci --omit=dev --ignore-scripts -w @vacina/api -w @vacina/shared
          mkdir -p pacote
          cp apps/api/host.json apps/api/package.json pacote/
          cp -r apps/api/dist pacote/dist
          # -L resolve o link do workspace @vacina/shared para os arquivos reais.
          cp -rL node_modules pacote/node_modules

      - name: Entrar na Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar na Function App (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME }}
          package: pacote
          sku: flexconsumption

      - name: Teste de fumaça
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$API_URL/health"; then exit 0; fi
            sleep 10
          done
          exit 1

  nlp:
    name: Publicar o serviço de PLN
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # As bibliotecas vão dentro do pacote (.python_packages), compiladas para Linux, como o
      # Flex Consumption espera. O modelo é treinado na partida do serviço.
      - name: Montar o pacote
        run: |
          mkdir -p pacote-nlp
          pip install -r apps/nlp/requirements.txt --target pacote-nlp/.python_packages/lib/site-packages
          cp apps/nlp/host.json apps/nlp/function_app.py pacote-nlp/
          cp -r apps/nlp/vacina_nlp pacote-nlp/vacina_nlp
          find pacote-nlp -name __pycache__ -type d -prune -exec rm -rf {} +

      - name: Entrar na Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar na Function App (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.NLP_FUNCTIONAPP_NAME }}
          package: pacote-nlp
          sku: flexconsumption

      - name: Teste de fumaça
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS "https://${NLP_FUNCTIONAPP_NAME}.azurewebsites.net/api/health"; then exit 0; fi
            sleep 15
          done
          exit 1

  web:
    name: Publicar o app web
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Gerar o app web
        env:
          # Valor público (endereço da API), nunca um segredo.
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          npm ci --ignore-scripts
          npm run build -w @vacina/shared
          npm run build -w @vacina/mobile

      - name: Publicar no Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/mobile/dist
          skip_app_build: true
