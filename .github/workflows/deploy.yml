name: Deploy

# Publica a API, o PLN e o app web no Google Cloud Run (B79, ADR-038). Roda ao integrar na main ou
# manualmente. A Azure não é mais usada (créditos esgotados em 17/11/2026).
#
# O GitHub entra no Google Cloud por login federado (Workload Identity, sem chave guardada); o
# roteiro `scripts/gcp/ci-identidade.sh` cria a identidade uma vez. Ficam em Settings > Secrets and
# variables > Actions > Variables (identificadores, não são segredos de acesso por si sós):
#   GCP_PROJECT, GCP_WORKLOAD_IDENTITY_PROVIDER e GCP_SERVICE_ACCOUNT.
# Os serviços já existem (criados por `scripts/gcp/implantar.sh`); aqui só entra a imagem nova, e as
# variáveis e os segredos de cada serviço ficam como estão.
on:
  push:
    branches: [main]
    # Documentos Word e arte não mudam o que vai para o Google Cloud.
    paths-ignore:
      - 'doctos/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGIAO: us-central1
  # Endereços públicos dos serviços (mesmo valor em `apk.yml` e em `native-map-html.ts`).
  WEB_URL: https://vacina-web-mdqonfxhra-uc.a.run.app
  API_URL: https://vacina-api-mdqonfxhra-uc.a.run.app/api
  NLP_URL: https://vacina-nlp-mdqonfxhra-uc.a.run.app/api

jobs:
  publicar:
    name: Construir e publicar no Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Entrar no Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Instalar o gcloud
        uses: google-github-actions/setup-gcloud@v3

      # As três imagens saem do Cloud Build (amd64, como o Cloud Run), com a etiqueta do commit e
      # `latest`. O `^@^` troca o separador das substituições, porque a cidade do Pix pode ter vírgula.
      - name: Construir as imagens (Cloud Build)
        env:
          PROJETO: ${{ vars.GCP_PROJECT }}
          # Pix de doação (variáveis do repositório). Chave aleatória, mostrada no QR: não é segredo.
          PIX_KEY: ${{ vars.PIX_KEY }}
          PIX_NAME: ${{ vars.PIX_NAME }}
          PIX_CITY: ${{ vars.PIX_CITY }}
        run: |
          REPO="${REGIAO}-docker.pkg.dev/${PROJETO}/vacina"
          # O build roda numa conta própria e mínima (vacina-build), não na conta padrão do projeto.
          gcloud builds submit --project "${PROJETO}" --config scripts/gcp/cloudbuild.yaml \
            --service-account "projects/${PROJETO}/serviceAccounts/vacina-build@${PROJETO}.iam.gserviceaccount.com" \
            --substitutions "^@^_REPO=${REPO}@_TAG=${GITHUB_SHA}@_PIX_KEY=${PIX_KEY}@_PIX_NAME=${PIX_NAME}@_PIX_CITY=${PIX_CITY}" .

      - name: Publicar os serviços
        env:
          PROJETO: ${{ vars.GCP_PROJECT }}
        run: |
          REPO="${REGIAO}-docker.pkg.dev/${PROJETO}/vacina"
          for par in vacina-nlp:nlp vacina-api:api vacina-web:web; do
            gcloud run services update "${par%%:*}" --project "${PROJETO}" --region "${REGIAO}" \
              --image "${REPO}/${par##*:}:${GITHUB_SHA}" --quiet
          done

      - name: Teste de fumaça
        run: |
          conferir() { # nome, endereço, tentativas
            for i in $(seq 1 "$3"); do
              if curl -fsS -m 60 "$2" >/dev/null; then echo "$1 respondeu"; return 0; fi
              sleep 15
            done
            echo "::error::$1 não respondeu em $2"; return 1
          }
          conferir "API" "${API_URL}/health" 6
          conferir "PLN" "${NLP_URL}/health" 8
          conferir "App web (repassando /api)" "${WEB_URL}/api/health" 6
