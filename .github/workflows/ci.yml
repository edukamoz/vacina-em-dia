name: CI

# Executa a cada push em qualquer branch (SCRUM-24). Não escuta `pull_request`: o pull request já
# mostra o resultado do push da própria branch, e rodar os dois dobrava os minutos mensais do GitHub
# Actions. O pipeline falha se algum teste falhar, se a cobertura ficar abaixo de 80% ou se houver
# vulnerabilidade grave nas dependências. Mudanças só em `doctos/` (Word) e `assets/` (arte) não têm
# o que testar. O job de Docker (o mais demorado) roda na main e à mão, não em cada branch.
on:
  push:
    paths-ignore:
      - 'doctos/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Verificação de tipos (TypeScript estrito)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes com cobertura (mínimo de 80%)
        run: npm run test:coverage

      - name: Navegador dos testes de ponta a ponta (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: apps/mobile

      - name: Testes de ponta a ponta e de acessibilidade (Playwright)
        run: npm run test:e2e --workspace apps/mobile

      - name: Documentação do código (TypeDoc)
        run: npm run docs

      - name: Guardar os relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: |
            packages/shared/coverage
            apps/api/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar o relatório dos testes de ponta a ponta
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e2e
          path: apps/mobile/e2e/relatorio
          if-no-files-found: ignore
          retention-days: 14

  nlp:
    name: Serviço de PLN (pytest e cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/nlp
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/nlp/requirements-dev.txt

      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt

      # Falha se algum teste falhar ou a cobertura ficar abaixo de 80% (pyproject.toml).
      - name: Testes com cobertura (mínimo de 80%)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Só as dependências de produção (requirements.txt): as de teste não vão para a nuvem. Falha se
      # alguma versão fixada tiver vulnerabilidade conhecida; nesse caso, atualizar e registrar em
      # docs/tech-versions.md. A versão do pip-audit é fixada para a auditoria ser reproduzível.
      - name: Auditar as dependências de produção (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-nlp
          path: apps/nlp/coverage.xml
          if-no-files-found: ignore

  seguranca:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      # A API e o pacote compartilhado rodam na nuvem: qualquer vulnerabilidade alta ou crítica falha.
      - name: Auditar API e pacote compartilhado (alta ou crítica falha)
        run: npm audit --omit=dev --audit-level=high --workspace apps/api --workspace packages/shared

      # O app usa ferramentas de build do Expo com avisos conhecidos (docs/tech-versions.md):
      # só falha em vulnerabilidade crítica.
      - name: Auditar o conjunto todo (crítica falha)
        run: npm audit --omit=dev --audit-level=critical

      - name: Listar as vulnerabilidades altas para acompanhamento
        if: always()
        run: npm audit --omit=dev || true

  docker:
    name: Imagens Docker e teste de fumaça
    # Só depois da integração na main (ou à mão): economiza ~4 min por push em branch.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      # Constrói as imagens, sobe API, Azurite e app web e confere que respondem (SCRUM-25).
      - name: Subir o ambiente com Docker Compose
        run: docker compose up -d --build --wait

      - name: Testar a API e o app web (pela mesma origem)
        run: |
          curl -fsS http://localhost:7071/api/health
          curl -fsS http://localhost:8080/api/health > /dev/null
          # Sem sessão, a API recusa (401): prova que o proxy chega à API e que o acesso é conferido.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/members)" = "401"
          curl -fsS http://localhost:8080/ > /dev/null
          # Serviço de PLN: saúde livre e chatbot protegido pela chave da função (401 sem ela).
          curl -fsS http://localhost:7072/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://localhost:7072/api/chat)" = "401"
          # Login e chatbot de ponta a ponta: cadastro na API e pergunta que a API repassa ao PLN
          # (com a chave local de desenvolvimento do docker-compose).
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/register -H 'Content-Type: application/json' -d '{"email":"ci@exemplo.com.br","password":"uma frase longa e boa"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['accessToken'])")
          curl -fsS -X POST http://localhost:8080/api/assistant/message -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"text":"Para que serve a BCG?"}' | grep -q '"intent":"vacina_para_que_serve"'

      - name: Mostrar os logs se algo falhar
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
